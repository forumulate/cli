# Docs preview per pull request (FMU-F01), plus a link check (FMU-F05).
#
# Copy to .github/workflows/docs-preview.yml. Every pull request that touches
# docs/ gets a preview link of the space as the change would publish it, posted
# (and on every push, edited) as one comment with the diff table. Nothing is
# published until the merge, when your publish workflow runs.
#
# Secrets: FORUMULATE_TOKEN (a token with docs.write on the space).
# GITHUB_TOKEN is provided by Actions; `pull-requests: write` lets it comment.
name: Docs preview
on:
  pull_request:
    paths: ['docs/**', 'forumulate.yaml']
permissions:
  contents: read
  pull-requests: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i -g @forumulate/cli
      # Broken internal links and #anchors fail the check before anyone reviews.
      - run: forumulate check links docs
      - run: forumulate publish docs --org acme --space docs --preview pr-${{ github.event.number }} --comment --json --out preview.json
        env:
          FORUMULATE_TOKEN: ${{ secrets.FORUMULATE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with: { name: docs-preview, path: preview.json }

